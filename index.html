<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Visual Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visual Timer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" id="icon" href="">
<style>
:root{--red:#e5484d;--bg:#fff;--fg:#111;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f7}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#setup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:36px;transition:opacity .4s ease,visibility .4s,transform .4s ease;
 padding:calc(env(safe-area-inset-top,0px) + 14vh) 24px 0}
#disp{position:relative;font-size:min(15vw,76px);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1}
#disp .z{opacity:.28}
#d{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);border:0;padding:0;margin:0;background:transparent;
 color:transparent;caret-color:transparent;font-size:16px;outline:none;opacity:0}
#hint{font-size:14px;opacity:.45;margin-top:-22px}
#start{transition:opacity .25s ease,transform .15s ease;width:min(280px,100%);height:64px;border:0;border-radius:32px;background:var(--red);color:#fff;font:600 22px -apple-system,Arial,sans-serif}
#start:disabled{opacity:.35}
#start:active:not(:disabled){transform:scale(.97)}
#run{position:fixed;inset:0;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s ease,visibility .4s}
#fill{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--red);overflow:hidden}
#fill.done{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.xp{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:56px;height:56px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.xp svg{width:28px;height:28px;stroke-width:3.4;stroke-linecap:round;fill:none}
#xr svg{stroke:var(--red)}
#xb svg{stroke:var(--bg)}
#x{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:72px;height:72px;border:0;background:transparent;padding:0;z-index:5}
html,body{transition:background-color .3s ease,color .3s ease}
body.running #setup{opacity:0;visibility:hidden;pointer-events:none;transform:scale(.97)}
body.running #run{opacity:1;visibility:visible;pointer-events:auto}
</style>
</head>
<body>
<div id="setup">
  <div id="disp"><span id="t">00:00:00</span><input id="d" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" maxlength="12" aria-label="Zeit"></div>
  <div id="hint">Std · Min · Sek</div>
  <button id="start" disabled>Start</button>
</div>

<div id="run">
  <div class="xp" id="xr"><svg viewBox="0 0 28 28"><path d="M5 5l18 18M23 5L5 23"/></svg></div>
  <div id="fill">
    <div class="xp" id="xb"><svg viewBox="0 0 28 28"><path d="M5 5l18 18M23 5L5 23"/></svg></div>
  </div>
  <button id="x" aria-label="Abbrechen"></button>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var inp=$('d'),t=$('t'),start=$('start'),fill=$('fill');
  var digits='',raf=0,lock=null,t0=0,total=0;

  try{
    var c=document.createElement('canvas');c.width=c.height=180;var g=c.getContext('2d');
    g.fillStyle='#e5484d';g.fillRect(0,0,180,180);
    g.fillStyle='#fff';g.fillRect(40,90,100,50);
    g.globalAlpha=.35;g.fillRect(40,40,100,50);
    $('icon').href=c.toDataURL('image/png');
  }catch(e){}


  function pad(){return ('000000'+digits).slice(-6)}
  function render(){
    var p=pad(),first=p.search(/[1-9]/),out='';
    if(first<0)first=6;
    for(var i=0;i<6;i++){
      var ch='<span'+(i<first?' class="z"':'')+'>'+p[i]+'</span>';
      out+=ch+((i==1||i==3)?'<span class="'+(i<first?'z':'')+'">:</span>':'');
    }
    t.innerHTML=out;
    start.disabled=!digits;
  }
  inp.addEventListener('input',function(){
    digits=inp.value.replace(/\D/g,'').slice(-6).replace(/^0+/,'');
    inp.value=digits;render();
  });
  inp.addEventListener('focus',function(){inp.value=digits});
  render();inp.value=digits;
  try{inp.focus()}catch(e){}

  // Bildschirmsperre verhindern: Wake Lock + unsichtbares Mini-Video (wie bei einem laufenden Video in Safari)
  var vid=null;
  function getVid(){
    if(vid)return vid;
    vid=document.createElement('video');
    vid.setAttribute('playsinline','');vid.setAttribute('muted','');vid.setAttribute('aria-hidden','true');
    vid.muted=true;vid.loop=true;
    vid.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none';
    vid.src='data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAMzbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAB9AAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAl10cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAB9AAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAACAAAAAgAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAfQAAAAAAABAAAAAAHVbWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAAAgABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABgG1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAUBzdGJsAAAAuHN0c2QAAAAAAAAAAQAAAKhhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAACAAIABIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAALmF2Y0MBQsAK/+EAFmdCwArZCWwEQAAAAwBAAAADAQPEiZIBAAVoy4PLIAAAABBwYXNwAAAAAQAAAAEAAAAUYnRydAAAAAAAAAqMAAAKjAAAABhzdHRzAAAAAAAAAAEAAAAEAAAgAAAAABRzdHNzAAAAAAAAAAEAAAABAAAAHHN0c2MAAAAAAAAAAQAAAAEAAAAEAAAAAQAAACRzdHN6AAAAAAAAAAAAAAAEAAAChQAAAAoAAAAKAAAACgAAABRzdGNvAAAAAAAAAAEAAANjAAAAYnVkdGEAAABabWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAbWRpcmFwcGwAAAAAAAAAAAAAAAAtaWxzdAAAACWpdG9vAAAAHWRhdGEAAAABAAAAAExhdmY2MC4xNi4xMDAAAAAIZnJlZQAAAqttZGF0AAACcAYF//9s3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE2NCByMzEwOCAzMWUxOWY5IC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAyMyAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbCAtIG9wdGlvbnM6IGNhYmFjPTAgcmVmPTMgZGVibG9jaz0xOjA6MCBhbmFseXNlPTB4MToweDExMSBtZT1oZXggc3VibWU9NyBwc3k9MSBwc3lfcmQ9MS4wMDowLjAwIG1peGVkX3JlZj0xIG1lX3JhbmdlPTE2IGNocm9tYV9tZT0xIHRyZWxsaXM9MSA4eDhkY3Q9MCBjcW09MCBkZWFkem9uZT0yMSwxMSBmYXN0X3Bza2lwPTEgY2hyb21hX3FwX29mZnNldD0tMiB0aHJlYWRzPTEgbG9va2FoZWFkX3RocmVhZHM9MSBzbGljZWRfdGhyZWFkcz0wIG5yPTAgZGVjaW1hdGU9MSBpbnRlcmxhY2VkPTAgYmx1cmF5X2NvbXBhdD0wIGNvbnN0cmFpbmVkX2ludHJhPTAgYmZyYW1lcz0wIHdlaWdodHA9MCBrZXlpbnQ9MjUwIGtleWludF9taW49MiBzY2VuZWN1dD00MCBpbnRyYV9yZWZyZXNoPTAgcmNfbG9va2FoZWFkPTQwIHJjPWNyZiBtYnRyZWU9MSBjcmY9MjMuMCBxY29tcD0wLjYwIHFwbWluPTAgcXBtYXg9NjkgcXBzdGVwPTQgaXBfcmF0aW89MS40MCBhcT0xOjEuMDAAgAAAAA1liIQFPJigAD+/J114AAAABkGaOAp5YAAAAAZBmlQCnlgAAAAGQZpgEvLA';
    document.body.appendChild(vid);
    return vid;
  }
  async function getLock(){
    try{var p=getVid().play();if(p&&p.catch)p.catch(function(){})}catch(e){}
    try{
      if(navigator.wakeLock&&!lock){
        lock=await navigator.wakeLock.request('screen');
        lock.addEventListener('release',function(){lock=null});
      }
    }catch(e){}
  }
  function freeLock(){
    try{if(vid)vid.pause()}catch(e){}
    try{if(lock){var l=lock;lock=null;l.release()}}catch(e){}
  }

  function tick(now){
    var left=total-(now-t0);
    if(left<=0){fill.style.height='100%';fill.classList.add('done');return}
    fill.style.height=(left/total*100)+'%';
    raf=requestAnimationFrame(tick);
  }

  start.onclick=function(){
    var p=pad(),h=+p.slice(0,2),m=+p.slice(2,4),s=+p.slice(4,6);
    var secs=Math.min(h*3600+m*60+s,359999);
    if(secs<=0)return;
    total=secs*1000;
    var H=Math.floor(secs/3600),M=Math.floor(secs%3600/60),S=secs%60;
    digits=String(H*10000+M*100+S);inp.value=digits;render();
    inp.blur();
    fill.classList.remove('done');fill.style.height='100%';
    document.body.classList.add('running');
    getLock();
    t0=performance.now();raf=requestAnimationFrame(tick);
  };

  $('x').onclick=function(){
    cancelAnimationFrame(raf);fill.classList.remove('done');
    document.body.classList.remove('running');freeLock();
    digits='';inp.value='';render();
  };

  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&document.body.classList.contains('running'))getLock();
  });
})();
</script>
</body>
</html>
